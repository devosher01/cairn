name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install mvdan.cc/gofumpt@latest
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: test -z "$(gofumpt -l .)"
      - run: go vet ./...
      - run: staticcheck ./...
      - run: go run ./tools/lawcheck .
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -run='^$' -fuzz=FuzzReader -fuzztime=20s ./internal/batch/
      - run: go test -run='^$' -fuzz=FuzzOpen -fuzztime=20s ./internal/sstable/
      - run: go test -run='^$' -fuzz=FuzzDecode -fuzztime=20s ./internal/manifest/
      - run: go test -run='^$' -fuzz=FuzzReplay -fuzztime=20s ./internal/wal/
      - run: go test -run='^$' -fuzz=FuzzModelOps -fuzztime=20s ./internal/modeltest/
  kill9:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./tools/crashkill -iterations 8
  bench-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
        working-directory: bench
      - run: go test -run TestAmplification -short ./...
        working-directory: bench
