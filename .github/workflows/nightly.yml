name: nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  model-campaign:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CAIRN_CAMPAIGN_SCALE: "40"
      CAIRN_EXTRA_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -run 'TestModel' -timeout 80m .
  crash-campaign:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CAIRN_CAMPAIGN_SCALE: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -run 'TestCrashCampaign_FullEngine' -timeout 80m .
  fuzz-long:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -run='^$' -fuzz=FuzzReader -fuzztime=10m ./internal/batch/
      - run: go test -run='^$' -fuzz=FuzzOpen -fuzztime=10m ./internal/sstable/
      - run: go test -run='^$' -fuzz=FuzzDecode -fuzztime=10m ./internal/manifest/
      - run: go test -run='^$' -fuzz=FuzzReplay -fuzztime=10m ./internal/wal/
      - run: go test -run='^$' -fuzz=FuzzModelOps -fuzztime=10m .
  kill9-long:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./tools/crashkill -iterations 150
